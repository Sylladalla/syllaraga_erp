{% extends "base.html" %}


{% block title %}
Supprimer produit
{% endblock %}



{% block content %}

<div class="container mt-4">


<div class="card shadow">


<div class="card-body text-center">


<h3>
⚠️ Supprimer le produit ?
</h3>


<p>

Voulez-vous vraiment supprimer :

<strong>
{{ produit.nom }}
</strong>

?

</p>



<form method="POST">

{% csrf_token %}


<button 
class="btn btn-danger">

🗑️ Supprimer

</button>



<a href="{% url 'liste_produits' %}"
class="btn btn-secondary">

Annuler

</a>


</form>


</div>


</div>


</div>


{% endblock %}
