{% extends "base.html" %}

{% block title %}
Ajouter une zone
{% endblock %}

{% block content %}

<div class="container mt-4">

```
<div class="card shadow">

    <div class="card-header bg-primary text-white">

        <h3>
            📍 Ajouter une zone de livraison
        </h3>

    </div>

    <div class="card-body">

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">
                    Nom de la zone
                </label>

                {{ form.nom }}

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Frais de livraison
                </label>

                {{ form.frais }}

            </div>


            <button type="submit"
                    class="btn btn-success">

                💾 Enregistrer

            </button>


            <a href="{% url 'liste_zones' %}"
               class="btn btn-secondary">

                Retour

            </a>

        </form>

    </div>

</div>
```

</div>

{% endblock %}
