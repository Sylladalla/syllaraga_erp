{% load static %}

<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Connexion - Syllaraga</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <style>

        body {
            background:
                linear-gradient(
                    135deg,
                    #008C95,
                    #2E8B57
                );

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;
        }

        .login-box {

            width: 100%;

            max-width: 430px;

            background: white;

            border-radius: 20px;

            padding: 40px;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,.20);
        }

        .logo {

            width: 70px;

            height: 70px;

            border-radius: 50%;

            background-color: #008C95;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 32px;

            margin: auto;
        }

        .title {

            color: #164d37;

            font-weight: 800;
        }

        .form-control {

            border-radius: 10px;

            padding: 12px;
        }

        .btn-login {

            background-color: #008C95;

            color: white;

            border: none;

            border-radius: 10px;

            padding: 13px;

            width: 100%;

            font-weight: 700;
        }

        .btn-login:hover {

            background-color: #00747b;

            color: white;
        }

        .back-link {

            color: #008C95;

            text-decoration: none;
        }

    </style>

</head>


<body>


<div class="login-box">


    <!-- LOGO -->

    <div class="logo mb-3">

        <i class="bi bi-shop"></i>

    </div>


    <div class="text-center">

        <h2 class="title">

            Bienvenue chez Syllaraga

        </h2>

        <p class="text-muted">

            Connectez-vous pour passer votre commande.

        </p>

    </div>


    <!-- ERREURS -->

    {% if form.errors %}

        <div class="alert alert-danger">

            <i class="bi bi-exclamation-circle me-2"></i>

            Nom d'utilisateur ou mot de passe incorrect.

        </div>

    {% endif %}


    <!-- FORMULAIRE -->

    <form
        method="post"
        action="{% url 'login' %}"
        class="mt-4"
    >

        {% csrf_token %}


        {% if next %}

            <input
                type="hidden"
                name="next"
                value="{{ next }}"
            >

        {% endif %}


        <!-- USERNAME -->

        <div class="mb-3">

            <label
                class="form-label fw-bold"
                for="id_username"
            >

                Nom d'utilisateur

            </label>

            <div class="input-group">

                <span class="input-group-text">

                    <i class="bi bi-person"></i>

                </span>

                <input
                    type="text"
                    name="username"
                    id="id_username"
                    class="form-control"
                    placeholder="Votre nom d'utilisateur"
                    required
                    autofocus
                >

            </div>

        </div>


        <!-- PASSWORD -->

        <div class="mb-4">

            <label
                class="form-label fw-bold"
                for="id_password"
            >

                Mot de passe

            </label>

            <div class="input-group">

                <span class="input-group-text">

                    <i class="bi bi-lock"></i>

                </span>

                <input
                    type="password"
                    name="password"
                    id="id_password"
                    class="form-control"
                    placeholder="Votre mot de passe"
                    required
                >

            </div>

        </div>


        <!-- BOUTON -->

        <button
            type="submit"
            class="btn btn-login"
        >

            <i class="bi bi-box-arrow-in-right me-2"></i>

            Se connecter

        </button>

    </form>


    <!-- RETOUR -->

    <div class="text-center mt-4">

        <a
            href="/"
            class="back-link"
        >

            <i class="bi bi-arrow-left me-1"></i>

            Retour à la boutique

        </a>

    </div>

</div>


</body>

</html>
