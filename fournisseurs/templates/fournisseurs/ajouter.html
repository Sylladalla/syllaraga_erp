{% extends "base.html" %}

{% block title %}
Ajouter un fournisseur
{% endblock %}


{% block content %}

<div class="container mt-4">


    <div class="card shadow">


        <div class="card-header bg-success text-white">

            <h3>
                ➕ Ajouter un fournisseur
            </h3>

        </div>



        <div class="card-body">


            <form method="POST">

                {% csrf_token %}


                <div class="mb-3">

                    <label class="form-label">
                        Nom du fournisseur
                    </label>

                    {{ form.nom }}

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Téléphone
                    </label>

                    {{ form.telephone }}

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    {{ form.email }}

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Adresse
                    </label>

                    {{ form.adresse }}

                </div>



                <button
                    type="submit"
                    class="btn btn-success">

                    Enregistrer

                </button>



                <a href="{% url 'liste_achats' %}"
                   class="btn btn-secondary">

                    Annuler

                </a>


            </form>


        </div>


    </div>


</div>


{% endblock %}
