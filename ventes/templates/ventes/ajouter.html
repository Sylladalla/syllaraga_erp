{% extends "base.html" %}

{% block title %}
Ajouter une vente
{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">

            <h3>
                🛒 Ajouter une vente
            </h3>

        </div>

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">
                        Client
                    </label>

                    {{ form.client }}

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Type de vente
                    </label>

                    {{ form.type_vente }}

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Frais de livraison
                    </label>

                    {{ form.frais_livraison }}

                </div>


                <button
                    type="submit"
                    class="btn btn-primary">

                    Enregistrer

                </button>


                <a href="{% url 'liste_ventes' %}"
   class="btn btn-secondary">

    Annuler

</a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
