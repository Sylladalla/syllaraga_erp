
{% load static %}

<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Connexion - Syllaraga ERP</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <style>

        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background: linear-gradient(
                135deg,
                #198754,
                #0d6efd
            );

        }


        .login-card {

            width: 100%;

            max-width: 430px;

            border: none;

            border-radius: 15px;

            overflow: hidden;

        }


        .login-header {

            padding: 30px;

            text-align: center;

            background: white;

        }


        .login-header i {

            font-size: 55px;

            color: #198754;

        }


        .login-header h2 {

            margin-top: 15px;

            font-weight: bold;

        }


        .login-body {

            padding: 30px;

        }


        .btn-login {

            padding: 12px;

            font-weight: bold;

        }

.logo-syllaraga {
    width: 100px;
    height: 100px;
    object-fit: contain;
    display: block;
    margin: 0 auto 15px;
}

    </style>

</head>


<body>


<div class="card login-card shadow-lg">


    <!-- LOGO / TITRE -->

    
{% load static %}

<div class="login-header">

    <img src="{% static 'images/logo-syllaraga.png' %}"
         alt="Logo Syllaraga"
         class="logo-syllaraga">

    <h2>
        SYLLARAGA ERP
    </h2>

    <p class="text-muted mb-0">
        Gestion de votre activité
    </p>

</div>



    <!-- FORMULAIRE -->

    <div class="login-body">


        {% if messages %}

            {% for message in messages %}

                <div class="alert alert-{{ message.tags }}">

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}


        <h4 class="text-center mb-4">

            🔐 Bienvenue

        </h4>


        <form method="POST">

            {% csrf_token %}


            <!-- UTILISATEUR -->

            <div class="mb-3">

                <label class="form-label">

                    Nom d'utilisateur

                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-person"></i>

                    </span>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="Votre nom d'utilisateur"
                        required
                    >

                </div>

            </div>


            <!-- MOT DE PASSE -->

            <div class="mb-4">

                <label class="form-label">

                    Mot de passe

                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="bi bi-lock"></i>

                    </span>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Votre mot de passe"
                        required
                    >

                </div>

            </div>


            <!-- BOUTON -->

            <button
                type="submit"
                class="btn btn-success btn-login w-100">

                <i class="bi bi-box-arrow-in-right"></i>

                Se connecter

            </button>


        </form>


    </div>


</div>


</body>

</html>
